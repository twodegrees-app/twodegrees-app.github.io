<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>於溫｜關於兩個人的溫度</title>
<meta name="description" content="於溫 Two Degrees：關於兩個人的溫度。意見不同時，陪你們找回溫度；平常，幫你們留住溫度。">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FBF3EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="於溫">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one calm column, a sticky progress rail on top; partner A = indigo, partner B = moss */
:root{
  --bg:#F2F3F1;
  --surface:#FFFFFF;
  --ink:#1F2A33;
  --muted:#5F6B73;
  --line:#DCE0DD;
  --a:#4B5DA6;
  --a-soft:#E6E9F5;
  --b:#4F7F5C;
  --b-soft:#E3EEE6;
  --warn:#A2492F;
  --warn-soft:#F7E6DF;
  --font-display:"LXGW WenKai TC","Noto Serif TC",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161B1F;--surface:#20272C;--ink:#E7EBEC;--muted:#9AA6AD;--line:#33403F;
    --a:#8E9EE0;--a-soft:#2A3150;--b:#8CC39A;--b-soft:#253A2C;--warn:#E59A80;--warn-soft:#3C2A24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161B1F;--surface:#20272C;--ink:#E7EBEC;--muted:#9AA6AD;--line:#33403F;
  --a:#8E9EE0;--a-soft:#2A3150;--b:#8CC39A;--b-soft:#253A2C;--warn:#E59A80;--warn-soft:#3C2A24;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* line-break rule: Chinese breaks only at punctuation/spaces; a run longer than the line may still break so nothing overflows */
body,button,input,textarea{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
.fit-seg .seg{display:inline;white-space:nowrap}
.kn-q.fit-seg .seg{display:block}
.fit-seg .seg.wrap{white-space:normal}
.fit-seg.fit{white-space:normal;overflow:visible}
.fit{white-space:nowrap;overflow:hidden;text-overflow:clip;display:block;max-width:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{font-family:var(--font-display);font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.brand-logo{height:24px;width:auto;display:block}
.hero{display:grid;justify-items:start;gap:4px;margin:28px 0 8px}
.hero-logo{width:150px;height:auto;display:block;margin-bottom:6px}
.hero-name{font-family:var(--font-display);font-size:44px;font-weight:700;line-height:1.1;margin:0}
.hero-tag{font-family:var(--font-display);font-size:19px;color:var(--muted);margin:0}
.who{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.who button{font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.who button[aria-pressed="true"].ra{background:var(--a);border-color:var(--a);color:#fff}
.who button[aria-pressed="true"].rb{background:var(--b);border-color:var(--b);color:#fff}
.rail{max-width:680px;margin:0 auto;padding:0 16px 10px;display:flex;gap:4px}
.rail span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.rail span.on{background:var(--me,var(--a))}
.rail-label{max-width:680px;margin:0 auto;padding:0 16px 8px;font-size:12px;color:var(--muted)}
h1,h2{font-family:var(--font-display);text-wrap:balance;line-height:1.35}
h1{font-size:30px;margin:32px 0 8px}
h2{font-size:23px;margin:28px 0 6px}
h3{font-size:16px;margin:0 0 6px}
p.lead{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;margin:14px 0}
.card.a{border-left:4px solid var(--a)}
.card.b{border-left:4px solid var(--b)}
.card.warn{border-color:var(--warn);background:var(--warn-soft)}
label.q{font-weight:500;display:block;margin-bottom:6px}
.hint{font-size:13px;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--me,var(--a));outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--me-soft,var(--a-soft));border-color:var(--me,var(--a));font-weight:500}
/* cover: matches the 於溫 封面 design (single light theme by design) */
body.on-cover{background:#FBEADA linear-gradient(180deg,#EDF1F4 0px,#FAF7F2 410px,#FBEADA 980px) no-repeat;min-height:100vh;color:#2B2F33;color-scheme:light}
body.on-cover .wrap{max-width:430px}
body.on-cover header.top{background:#EDF1F4;border-bottom-color:#E2DBD0;color:#2B2F33}
body.on-cover .pill{background:#E6DED2;color:#2B2F33}
.cv{display:flex;flex-direction:column;align-items:center;gap:36px;padding:0 8px 48px;color:#2B2F33}
.cv-top{position:relative;width:100%;box-sizing:border-box;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:56px 0 112px}
.cv-more{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#7A6A58;font:inherit;font-size:13px;letter-spacing:2px;cursor:pointer;padding:8px 16px;transition:opacity .4s}
.cv-more svg{animation:cvBounce 1.8s ease-in-out infinite}
.cv-more.gone{opacity:0;pointer-events:none}
@keyframes cvBounce{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(8px);opacity:1}}
@media (prefers-reduced-motion: reduce){.cv-more svg{animation:none}}
.cv-hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.cv-logo{width:188px;height:120px;object-fit:contain;display:block;margin-bottom:6px}
.cv-name{margin:0;font-family:var(--font-display);font-size:48px;font-weight:700;line-height:1.1;letter-spacing:4px;color:#2B2F33}
.cv-tag{margin:0;font-family:var(--font-display);font-size:20px;line-height:1.4;letter-spacing:2px;color:#5E6670}
.cv-desc{margin:14px 0 0;max-width:300px;font-size:15px;line-height:1.8;color:#4A525A}
.cv-btns{width:100%;display:flex;flex-direction:column;gap:12px}
.cv-primary{width:100%;height:54px;border:none;border-radius:14px;background:#A0541A;color:#fff;font:inherit;font-size:17px;font-weight:700;letter-spacing:1px;cursor:pointer;box-shadow:0 6px 18px rgba(160,84,26,.22)}
.cv-primary:hover{background:#8C4814}
.cv-secondary{width:100%;height:52px;border:1.5px solid #CFC6BA;border-radius:14px;background:rgba(255,255,255,.6);color:#2B2F33;font:inherit;font-size:16px;font-weight:500;cursor:pointer}
.cv-primary:focus-visible,.cv-secondary:focus-visible,.cv-back:focus-visible,.cv-link:focus-visible{outline:2px solid #3F6E96;outline-offset:3px}
.cv-feat{width:100%;display:flex;flex-direction:column;gap:14px;scroll-margin-top:24px;padding-top:8px}
.cv-label{margin:0;font-size:13px;letter-spacing:2px;color:#5E6670;text-align:center}
.cv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cv-card{display:flex;flex-direction:column;gap:8px;padding:16px 14px;border-radius:16px;background:rgba(255,255,255,.72);border:1px solid #ECE4D8}
.cv-card h2{margin:0;font-family:var(--font-body);font-size:16px;font-weight:700;color:#2B2F33;line-height:1.4}
.cv-card p{margin:0;font-size:13px;line-height:1.6;color:#4A525A}
.cv-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.cv-icon.cool{background:#E3ECF4}.cv-icon.warm{background:#FBE6CF}
.cv-sub{align-items:stretch;gap:20px;padding-top:28px;padding-bottom:40px}
.cv-back{align-self:flex-start;font:inherit;font-size:15px;background:none;border:none;color:#4A525A;padding:8px 0;cursor:pointer}
.cv-title{margin:0;font-family:var(--font-display);font-size:30px;color:#2B2F33}
.cv-form{display:grid;gap:16px;background:rgba(255,255,255,.72);border:1px solid #ECE4D8;border-radius:16px;padding:18px}
.cv-form input[type=text]{background:#fff;color:#2B2F33;border-color:#DCD3C6}
.cv-form .q{color:#2B2F33}
.cv-link{align-self:center;font:inherit;font-size:15px;background:none;border:none;color:#A0541A;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}
body.on-cover .demo-note{background:rgba(255,255,255,.6);color:#4A525A;border-color:#DCD3C6}
.linkish{font:inherit;font-size:12px;background:none;border:none;color:inherit;text-decoration:underline;cursor:pointer;padding:0}
body.on-cover .card.wait{background:rgba(255,255,255,.72);border-color:#ECE4D8;color:#2B2F33}
body.on-cover .card.a,body.on-cover .card.b{background:rgba(255,255,255,.72);color:#2B2F33}
.hub-list{display:grid;gap:12px}
.hub-item{font:inherit;text-align:left;display:flex;gap:14px;align-items:center;padding:16px;border-radius:16px;background:rgba(255,255,255,.78);border:1px solid #ECE4D8;color:#2B2F33;cursor:pointer;width:100%}
.hub-item:focus-visible,.kn-opt:focus-visible,.kn-role:focus-visible{outline:2px solid #3F6E96;outline-offset:2px}
.hub-item.off{cursor:default;opacity:.62}
.hub-text{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:2px;min-width:0}
.hub-text strong{font-size:16px}
.hub-text>span{font-size:13px;line-height:1.6;color:#4A525A}
.hub-go{flex:none;font-size:13px;font-weight:700;color:#A0541A}
.hub-item.off .hub-go{color:#5E6670;font-weight:500}
.kn-steps{margin:0;padding:0 0 0 1.4em;display:grid;gap:10px;color:#2B2F33}
.kn-steps li span{display:block;font-size:13px;color:#4A525A}
.kn-note{margin:0;font-size:12px;line-height:1.7;color:#5E6670}
.kn-prog{height:6px;border-radius:3px;background:#E6DED2;overflow:hidden}
.kn-prog span{display:block;height:100%;background:#A0541A;border-radius:3px;transition:width .3s}
.kn-phase{text-align:left;margin-top:-4px}
.kn-q{margin:0;font-family:var(--font-display);font-size:25px;line-height:1.45;color:#2B2F33;text-wrap:balance}
.kn-opts{display:grid;gap:10px}
.kn-opt{font:inherit;font-size:16px;line-height:1.5;text-align:left;padding:16px 18px;border-radius:14px;border:1.5px solid #E2D9CC;background:rgba(255,255,255,.8);color:#2B2F33;cursor:pointer;min-height:56px}
.kn-opt[aria-pressed="true"]{border-color:#A0541A;background:#FBE6CF;font-weight:500}
.call-card{display:flex;gap:12px;align-items:flex-start;margin:0 0 14px;padding:16px;border-radius:16px;background:#FFF1E2;border:1px solid #F1CFAA}
.call-card strong{display:block;font-size:16px;color:#7A3F12;margin-bottom:4px}
.call-card p{margin:0 0 12px;font-size:14px;line-height:1.7;color:#5E4A3A}
.call-card .btn{background:#A0541A;border-color:#A0541A}
.call-dot{flex:none;width:10px;height:10px;margin-top:7px;border-radius:50%;background:#E07A2E;box-shadow:0 0 0 4px rgba(224,122,46,.18);animation:callpulse 1.8s ease-in-out infinite}
@keyframes callpulse{50%{box-shadow:0 0 0 8px rgba(224,122,46,.05)}}
@media (prefers-reduced-motion:reduce){.call-dot{animation:none}}
.notify-card{display:grid;gap:8px;margin:0 0 16px;padding:14px 16px;border-radius:14px;background:#FFF7EE;border:1px solid #EADFD2}
.notify-card p{margin:0;font-size:14px;line-height:1.7}
.notify-card .btn{justify-self:start}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px;min-height:44px}
.nav-reset{font:inherit;font-size:14px;background:none;border:none;color:#8A6A55;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 0;white-space:nowrap}
.nav-confirm{margin-top:4px;padding:16px;border-radius:14px;background:#FFF7EE;border:1px solid #EADFD2;display:grid;gap:12px}
.nav-confirm p{margin:0;font-size:15px;line-height:1.7}
.nav-confirm-btns{display:flex;gap:10px;flex-wrap:wrap}
.nav-confirm .btn{border-color:#A0541A;background:#A0541A}
.nav-confirm .btn.ghost{background:transparent;color:#A0541A}
.rv-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#F3ECE3;padding:4px;border-radius:12px}
.rv-tab{font:inherit;font-size:14px;border:none;background:none;padding:10px 2px;border-radius:9px;color:#5E6670;cursor:pointer;white-space:nowrap}
.rv-tab[aria-selected="true"]{background:#fff;color:#A0541A;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.rv-list{display:grid;gap:10px}
.rv-item{background:rgba(255,255,255,.88);border:1px solid #ECE4D8;border-radius:14px}
.rv-item>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px}
.rv-item>summary::-webkit-details-marker{display:none}
.rv-item>summary::after{content:"＋";color:#A0541A;flex:none}
.rv-item[open]>summary::after{content:"－"}
.rv-icons{display:flex;flex:none}
.rv-icons .r-ico+.r-ico{margin-left:-8px;box-shadow:0 0 0 2px #fff}
.rv-sum{display:grid;gap:2px;flex:1;min-width:0}
.rv-sum strong{font-size:15px;display:flex;gap:8px;align-items:center}
.rv-sum span{font-size:13px;color:#5E6670}
.rv-new{font-style:normal;font-size:12px;font-weight:500;color:#A0541A;background:#FBE6CF;border-radius:999px;padding:1px 8px}
.rv-new.rv-unf{background:#ECE6DE;color:#6B5E52;margin-left:6px}
.rv-body{padding:0 16px 16px;display:grid;gap:12px;font-size:14px;line-height:1.7}
.rv-body h4{margin:0;font-size:13px;color:#8A6A55;font-weight:600}
.rv-body p{margin:0}
.rv-kv{display:grid;gap:6px}
.rv-kv div{padding:10px 12px;background:#FAF7F2;border-radius:10px}
.rv-kv b{display:block;font-size:12px;color:#5E6670;font-weight:500}
.rv-body .linkbtn{justify-self:start;margin-top:-6px}
.rv-jump{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;font:inherit;font-size:15px;text-align:left;cursor:pointer;color:inherit}
.rv-detail{padding-top:12px}
.rv-detail .rd-head{margin-top:0}
.rv-story{white-space:pre-wrap;padding:12px 14px;background:#FAF7F2;border-radius:10px;line-height:1.8}
.rv-agree{font-family:var(--font-display);font-size:17px;white-space:pre-wrap;padding:12px 14px;background:#FFF7EE;border-radius:10px}
.rv-empty{margin:0;padding:20px 16px;text-align:center;color:#5E6670;background:rgba(255,255,255,.7);border-radius:14px;font-size:14px;line-height:1.7}
.rv-tags{display:flex;flex-wrap:wrap;gap:6px}
.rv-tags span{font-size:13px;padding:2px 10px;border-radius:999px;background:#FBE6CF;color:#7A3F12}
.kn-nav{display:flex;justify-content:space-between;min-height:40px}
.kn-roles{display:grid;gap:8px}
.r-ico{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.r-ico svg{display:block}
.rd-head{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;background:rgba(255,255,255,.85);border:1px solid #ECE4D8;color:#2B2F33}
.rd-art{flex:none;width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rd-id{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.rd-num{font-size:13px;letter-spacing:2px}
.rd-name{font-family:var(--font-display);font-size:42px;line-height:1.1;font-weight:700}
.rd-tag{font-size:14px;line-height:1.6;color:#4A525A}
.rd-motto{padding:14px 18px;border-radius:999px;background:#fff;border:1.5px solid;text-align:center;font-family:var(--font-display);font-size:18px;line-height:1.5;color:#2B2F33;box-shadow:0 4px 14px rgba(160,84,26,.10)}
.rd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rd-box{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:rgba(255,255,255,.85);border:1px solid #ECE4D8;color:#2B2F33}
.rd-box h2{margin:0;padding:6px 0;border-radius:10px;text-align:center;font-family:var(--font-body);font-size:16px;font-weight:700;letter-spacing:2px}
.rd-box h2.cool{background:#E3ECF4;color:#2F5878}
.rd-box ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.6}
@media (max-width:380px){.rd-grid{gap:8px}.rd-box{padding:12px 10px}.rd-box ul{padding-left:1em;font-size:12.5px}}
.rd-stack{display:grid;gap:12px}
.rd-stack .rd-box ul{font-size:14px;gap:8px}
.rd-art.sm{width:52px;height:52px}
.rd-partner{display:grid;gap:10px;padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.9);border:1.5px solid;color:#2B2F33}
.rd-partner.wait{border:1.5px dashed #C9A27F;background:rgba(255,255,255,.6)}
.rd-partner h2{margin:0;font-family:var(--font-display);font-size:19px;line-height:1.4}
.rd-partner p{margin:0;font-size:14px;line-height:1.7;color:#4A525A}
.rd-partner-head{display:flex;gap:12px;align-items:center}
.rd-partner ul{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:14px;line-height:1.6}
.rd-partner-fight{background:#FAF7F2;border-radius:10px;padding:10px 12px}
.rd-partner-fight b{display:block;font-size:12px;font-weight:500;color:#5E6670}
.rd-second{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.6);border:1px dashed #C9A27F;color:#2B2F33}
.rd-second span{flex:none;font-size:13px;letter-spacing:1px;color:#8C4814}
.rd-second p{margin:0;font-size:14px;line-height:1.6}
.pair-hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 20px 22px;border-radius:20px;background:rgba(255,255,255,.85);border:1px solid #ECE4D8;text-align:center;color:#2B2F33}
.pair-arts{display:flex;align-items:center;justify-content:center}
.pair-art{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 4px 14px rgba(160,84,26,.10)}
.pair-art+.pair-art{margin-left:-18px}
.pair-who{display:flex;justify-content:center;gap:0;font-size:13px;color:#5E6670;margin-top:-2px}
.pair-who span{width:86px}
.pair-title{margin:4px 0 0;font-family:var(--font-display);font-size:34px;line-height:1.2;font-weight:700;color:#2B2F33;width:100%}
.pair-desc{margin:0;font-size:15px;line-height:1.8;color:#4A525A}
.lk{position:relative;display:grid;gap:10px;padding:18px 4px 4px}
.lk-line{position:absolute;left:21px;right:21px;top:39px;height:3px;border-radius:2px;background:linear-gradient(90deg,#7FA7C9,#D8CFC4 50%,#E0864A)}
.lk-dots{position:relative;display:flex;justify-content:space-between;align-items:center;height:44px}

.lk-dot[aria-pressed="true"] span{background:var(--c);box-shadow:0 0 0 5px rgba(160,84,26,.12)}
.lk-dot:focus-visible{outline:2px solid #3F6E96;outline-offset:2px}
.lk-ends{display:flex;justify-content:space-between;font-size:13px;color:#4A525A}

.vq-badge{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:#E3EEE6;color:#2F5A3A}

.vq-badge.low{background:#F7E6DF;color:#8A3A22}

.kn-card{display:grid;gap:10px;padding:18px;border-radius:16px;background:rgba(255,255,255,.8);border:1px solid #ECE4D8;color:#2B2F33}

.kn-list li span{color:#4A525A}

.rlist{display:grid;gap:8px}

.rd{display:block;font-size:14px;color:var(--muted)}

.dots{display:flex;gap:4px}

.temp button.on{background:var(--me,var(--a));color:#fff;border-color:var(--me,var(--a))}
.temp-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{font:inherit;font-weight:500;padding:10px 18px;border-radius:8px;border:1px solid var(--me,var(--a));background:var(--me,var(--a));color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--me,var(--a))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--warn);font-size:14px;min-height:1em}
.pill{justify-self:start;display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--line);color:var(--ink)}
.pill.a{background:var(--a-soft);color:var(--a)}
.pill.b{background:var(--b-soft);color:var(--b)}
dl.entry{margin:0;display:grid;gap:10px}
dl.entry dt{font-size:13px;color:var(--muted)}
dl.entry dd{margin:0;white-space:pre-wrap}
.split{display:grid;gap:14px}

.linkbox{display:flex;gap:8px;flex-wrap:wrap}
.linkbox code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.wait{text-align:left;padding:28px 18px}
.breathe{width:64px;height:64px;border-radius:50%;background:var(--me-soft,var(--a-soft));border:2px solid var(--me,var(--a));margin:8px 0;animation:br 8s ease-in-out infinite}

.res{display:grid;gap:8px}
.res div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0}
.res strong{font-variant-numeric:tabular-nums}
.demo-note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
footer{font-size:12px;color:var(--muted);margin-top:40px}

let S=load();
let role=S && S.lastRole ? S.lastRole : "a";
let view={};          // per-render scratch (drafts, local notices)
let draft={a:{},b:{}};

function load(){try{const t=localStorage.getItem(KEY);const x=t?JSON.parse(t):null;
  if(x){if(!x.act)x.act={a:"repair",b:"repair"};if(!x.q||!x.q.a||!("selfDone" in x.q.a))x.q=blankQuiz();if(!x.qh)x.qh=[];if(!x.qn)x.qn=blankNow();if(!x.qnh)x.qnh=[]}
  return x}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
window.addEventListener("storage",e=>{if(e.key===KEY){S=load();render()}});

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pname(r){return S&&S.names&&S.names[r]?S.names[r]:"你的伴侶"}
function other(r){return r==="a"?"b":"a"}
function nm(r){return S&&S.names&&S.names[r]?S.names[r]:(r==="a"?"建立者":"伴侶")}
function blankPerson(){return {safety:null,ready:null,entry:null,mirror:null,confirm:null,agree:null}}
function newSpace(nameA,nameB){
  return {id:Math.random().toString(36).slice(2,8),created:new Date().toISOString().slice(0,10),
    names:{a:nameA,b:""},hint:nameB,a:blankPerson(),b:blankPerson(),final:{text:"",ok:{a:false,b:false}},lastRole:"a",
    act:{a:"hub",b:"hub"},q:blankQuiz(),qh:[],qn:blankNow(),qnh:[],rh:[]};
}

/* ---------- state machine ---------- */
function stage(r){
  const me=S[r],ot=S[other(r)];
  if(!S.names[r]) return {k:"join",step:-1};
  if(me.paused) return {k:"selfPaused",step:1};
  if(S.names[other(r)]&&ot.paused) return {k:"paused",step:1};
  if(!me.reasons) return {k:"reasons",step:0};
  if(!ot.reasons) return {k:"wait",step:0,msg:"等 "+nm(other(r))+" 也選好，兩人都選好後才會一起揭曉。"};
  if(!me.reasonsSeen) return {k:"reasonsReveal",step:0};
  if(!me.ready) return {k:"ready",step:1};
  if(!me.entry) return {k:"entry",step:2};
  if(!ot.entry) return {k:"wait",step:2,msg:nm(other(r))+" 還在整理自己的想法。對方送出之前，你們都看不到彼此寫的內容。"};
  if(!me.mirror||me.mirror.revise) return {k:"mirror",step:3};
  if(!ot.mirror||ot.mirror.revise) return {k:"wait",step:3,msg:ot.mirror&&ot.mirror.revise?nm(other(r))+" 正在根據你的補充，重新複述一次。":nm(other(r))+" 正在讀你寫的內容，並試著複述。"};
  if(me.confirm!=="yes") return {k:"confirm",step:4};
  if(ot.confirm!=="yes") return {k:"wait",step:4,msg:"等 "+nm(other(r))+" 確認你的複述。"};
  if(!me.agree) return {k:"agree",step:5};
  if(!ot.agree) return {k:"wait",step:5,msg:nm(other(r))+" 還在寫自己願意做的部分。"};
  if(!(S.final.ok.a&&S.final.ok.b)) return {k:"final",step:5};
  return {k:"done",step:NS};
}

/* ---------- top bar ---------- */
function renderTop(st){
  const top=document.getElementById("top");
  if(!S&&pre==="cover"){top.innerHTML="";top.hidden=true;return}
  top.hidden=false;
  if(!S){top.innerHTML='<div class="top-inner"><span class="brand"><img src="'+LOGO+'" alt="" class="brand-logo">於溫</span></div>';return}
  if(st.mode){
    top.innerHTML='<div class="top-inner"><span class="brand"><img src="'+LOGO+'" alt="" class="brand-logo">於溫</span>'+
     '<div class="who"><span>示範視角</span>'+
     '<button type="button" class="ra" id="ra" aria-pressed="'+(role==="a")+'">'+esc(nm("a"))+'</button>'+
     '<button type="button" class="rb" id="rb" aria-pressed="'+(role==="b")+'">'+esc(S.names.b||"伴侶")+'</button></div></div>'+
     (st.mode==="know"||st.mode==="review"?'<div class="rail-label"><button type="button" class="cv-back" id="tohub">← 回到我們的空間</button></div>':'')+
     (st.mode==="kt"||st.mode==="kn"?'<div class="rail-label"><button type="button" class="cv-back" id="toknow">← 回到了解</button></div>':'');
    document.getElementById("ra").onclick=()=>switchRole("a");
    document.getElementById("rb").onclick=()=>switchRole("b");
    const th=document.getElementById("tohub"); if(th)th.onclick=()=>goAct("hub");
    const tk=document.getElementById("toknow"); if(tk)tk.onclick=()=>goAct("know");
    return;
  }
  const label=st.step>=0&&st.step<NS?("第 "+(st.step+1)+" 步／共 "+NS+" 步・"+STEPS[st.step]):(st.step===NS?"完成":"加入空間");
  top.innerHTML='<div class="top-inner"><span class="brand"><img src="'+LOGO+'" alt="" class="brand-logo">於溫</span>'+
   '<div class="who"><span>示範視角</span>'+
   '<button type="button" class="ra" id="ra" aria-pressed="'+(role==="a")+'">'+esc(nm("a"))+'</button>'+
   '<button type="button" class="rb" id="rb" aria-pressed="'+(role==="b")+'">'+esc(S.names.b||"伴侶")+'</button></div></div>'+

   '<div class="rail-label">'+esc(label)+(st.k!=="join"?' ・ <button type="button" class="linkish" id="tohub">回到我們的空間</button>':'')+'</div>';
  {const th=document.getElementById("tohub"); if(th)th.onclick=()=>goAct("hub");}
  document.getElementById("ra").onclick=()=>switchRole("a");
  document.getElementById("rb").onclick=()=>switchRole("b");
}

const app=document.getElementById("app");
let lastKey="";
function fitText(root){
  (root||document).querySelectorAll(".fit-seg").forEach(el=>{
    el.style.fontSize="";
    const base=parseFloat(getComputedStyle(el).fontSize)||16, min=Math.max(10,Math.round(base*0.62));
    let size=base, guard=40;
    const segs=[...el.children];
    segs.forEach(c=>c.classList.remove("wrap"));
    const wide=()=>segs.some(c=>c.getBoundingClientRect().width>el.clientWidth+1);
    if(el.matches("h1, h2, .kn-q, .rt2, .fit")){
      while(wide()&&size>min&&guard--){size-=1;el.style.fontSize=size+"px"}
    }else{
      const bmin=Math.round(base*0.9);
      while(wide()&&size>bmin&&guard--){size-=1;el.style.fontSize=size+"px"}
      segs.forEach(c=>{if(c.getBoundingClientRect().width>el.clientWidth+1)c.classList.add("wrap")});
    }
  });
  (root||document).querySelectorAll(".fit").forEach(el=>{
    el.style.fontSize="";
    const base=parseFloat(getComputedStyle(el).fontSize)||16, min=Math.max(12,Math.round(base*0.6));
    let size=base, guard=40;
    while(el.scrollWidth>el.clientWidth+1&&size>min&&guard--){size-=1;el.style.fontSize=size+"px"}
  });
  /* titles in the same group share the smallest fitted size, so sibling cards stay even */
  const groups={};
  (root||document).querySelectorAll(".fit[data-fg]").forEach(el=>{(groups[el.dataset.fg]=groups[el.dataset.fg]||[]).push(el)});
  Object.values(groups).forEach(list=>{const m=Math.min(...list.map(e=>parseFloat(getComputedStyle(e).fontSize)));list.forEach(e=>{e.style.fontSize=m+"px"})});
}
let fitTimer=null;
window.addEventListener("resize",()=>{clearTimeout(fitTimer);fitTimer=setTimeout(()=>fitText(),120)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitText());
function toTop(){
  const go=()=>{try{window.scrollTo({top:0,left:0,behavior:"auto"})}catch(e){window.scrollTo(0,0)}
    const se=document.scrollingElement||document.documentElement; if(se)se.scrollTop=0; document.body.scrollTop=0;};

}

function mirror(){
  const ot=other(role), prev=S[role].mirror, d=draft[role], o=nm(ot);
  const oe=S[ot].entry, tf=topFeel(ot).slice(0,3), care=oe.care.replace(/[。！!]$/,"").replace(/^我(最)?在意的(是)?/,"");
  if(!d.mInit){d.mp={feel:[],care:false,needs:[]};d.heard=prev?prev.heard:"";d.valid=prev?prev.valid:"";d.hEdit=!!prev;d.mInit=true}
  const mp=d.mp;
  const compose=()=>{
    const parts=[];
    if(mp.care) parts.push("你最在意的是「"+care+"」");
    if(mp.feel.length) parts.push("你那時候覺得"+tf.filter(f=>mp.feel.includes(f)).join("、"));
    if(mp.needs.length) parts.push("你需要"+oe.needs.filter(n=>mp.needs.includes(n)).join("、"));
    return parts.length?"我聽到"+parts.join("，")+"。":"";
  };
  const note=prev&&prev.revise?`<div class="card ${ot}"><h3>${esc(o)} 想補充</h3><div style="white-space:pre-wrap">${esc(prev.note)}</div><div class="hint">看完補充後，調整你的理解再送出一次。</div></div>`:"";
  const chip=(k,v,label)=>{const on=k==="care"?mp.care:mp[k].includes(v);return `<button type="button" class="chip" data-mk="${k}" data-mv="${esc(v)}" aria-pressed="${on}">${esc(label)}</button>`};
  app.innerHTML=`
  <h1>${prev&&prev.revise?"再確認一次你的理解":"讀讀"+esc(o)+"寫的，再說說你聽到的"}</h1>
  <p class="lead seg-auto">這不是要你照抄。${esc(o)}會看到你的理解，確認你真的懂。如果理解錯了，對方可以告訴你。</p>
  <p class="part-label"><span>1</span>先讀${esc(o)}的版本</p>
  ${entryView(ot)}
  ${note}
  <p class="part-label"><span>2</span>點出你最有感的部分</p>
  <div class="card">
    <div><div class="q" id="mf-l">${esc(o)}的感受</div><div class="chips" role="group" aria-labelledby="mf-l">${tf.map(f=>chip("feel",f,f)).join("")}</div></div>
    <div><div class="q" id="mc-l">${esc(o)}最在意的</div><div class="chips" role="group" aria-labelledby="mc-l">${chip("care",care,care)}</div></div>
    <div><div class="q" id="mn-l">${esc(o)}需要的</div><div class="chips" role="group" aria-labelledby="mn-l">${oe.needs.map(n=>chip("needs",n,n)).join("")}</div></div>
    <div><label class="q" for="heard">你要告訴${esc(o)}的理解</label>
      <div class="hint">會依照你點的內容自動組成，也可以自己修改。</div>
      <textarea id="heard" style="min-height:128px" placeholder="點上面的選項，這裡會自動出現一句話。">${esc(d.heard)}</textarea>
      <button type="button" class="linkbtn" id="regen" ${d.hEdit?"":"hidden"}>依照選項重新組一次</button></div>
    <div><label class="q" for="valid">想跟${esc(o)}說的一句話（選填）</label>${quick("valid")}<textarea id="valid" style="min-height:72px" placeholder="不寫也可以">${esc(d.valid)}</textarea></div>
    <div class="err" id="er"></div>
    <div class="actions"><button class="btn" type="button" id="go">送出我的理解</button></div>
  </div>
  <details class="card"><summary>看看我自己寫的版本</summary>${entryView(role)}</details>`;
  const H=document.getElementById("heard"), R=document.getElementById("regen");
  app.querySelectorAll("[data-mk]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.mk,v=b.dataset.mv;
    if(k==="care") mp.care=!mp.care; else mp[k]=mp[k].includes(v)?mp[k].filter(x=>x!==v):[...mp[k],v];
    b.setAttribute("aria-pressed",k==="care"?mp.care:mp[k].includes(v));
    if(!d.hEdit){d.heard=compose();H.value=d.heard}
  });
  H.oninput=e=>{d.heard=e.target.value;d.hEdit=true;R.hidden=false};
  R.onclick=()=>{d.heard=compose();H.value=d.heard;d.hEdit=false;R.hidden=true};
  document.getElementById("valid").oninput=e=>{d.valid=e.target.value};
  document.getElementById("go").onclick=()=>{
    if(!d.heard.trim()){document.getElementById("er").textContent="至少點一個你聽到的重點，或自己寫一句。";return}
    S[role].mirror={heard:d.heard.trim(),valid:(d.valid||"").trim(),emp:"",revise:false,note:""};
    S[ot].confirm=null; d.mInit=false; save();render()};
}

function notifyText(){return "我想跟你把上次的事慢慢說開，你準備好的時候打開於溫看看："+location.href.split(/[?#]/)[0]}
function notifyCard(){
  return `<div class="notify-card"><p class="seg-auto">已經提醒${esc(nm(other(role)))}：打開「我們的空間」就會看到你的邀請。也可以傳一則訊息給對方。</p><button type="button" class="btn ghost" id="notify">傳訊息提醒${esc(nm(other(role)))}</button><span class="hint" id="notify-m" aria-live="polite"></span></div>`;
}
function wireNotify(){
  const b=document.getElementById("notify"); if(!b)return;
  b.onclick=async()=>{
    const t=notifyText(), m=document.getElementById("notify-m");
    try{ if(navigator.share){await navigator.share({text:t});return} await navigator.clipboard.writeText(t); m.textContent="已複製，貼到 LINE 或訊息傳給對方。"}
    catch(e){ if(e&&e.name==="AbortError")return; m.textContent="無法自動複製，請手動傳訊息給對方。"}
  };
}

  const f=S.final, ot=other(role);
  app.innerHTML=`
  <h1>寫下你們的約定</h1>
  <p class="lead">把兩人的想法整理成一個具體做法，寫到「誰、什麼時候、做什麼」。任何一方修改內容後，兩人都要重新按同意。</p>
  <div class="split">${agreeView("a")}${agreeView("b")}</div>
  <div class="card">
    <div><label class="q" for="ft">我們約定的具體做法</label>${quick("ft")}<textarea id="ft" placeholder="例如：週末計畫要改時，提早一天說，並一起決定替代的時間。">${esc(f.text)}</textarea></div>
    <div class="hint">${f.ok[ot]?esc(nm(ot))+" 已經同意目前的內容。":esc(nm(ot))+" 還沒同意。"}</div>
    <div class="err" id="er"></div>
    <div class="actions"><button class="btn ghost" type="button" id="sv">儲存修改</button><button class="btn" type="button" id="ok" ${f.ok[role]?"disabled":""}>${f.ok[role]?"你已同意":"我同意這個約定"}</button></div>
  </div>`;
  const ta=document.getElementById("ft");
  document.getElementById("sv").onclick=()=>{const t=ta.value.trim();if(t!==f.text){f.text=t;f.ok={a:false,b:false};save()}render()};
  document.getElementById("ok").onclick=()=>{const t=ta.value.trim();
    if(!t){document.getElementById("er").textContent="請先寫下具體做法。";return}
    if(t!==f.text){f.text=t;f.ok={a:false,b:false}}
    f.ok[role]=true;if(f.ok.a&&f.ok.b)f.date=new Date().toISOString().slice(0,10);save();render()};
}

function done(){
  const f=S.final;
  const text="我們的約定（"+(f.date||S.created)+"）\n"+f.text+"\n\n"+nm("a")+" 願意："+S.a.agree.will+"\n"+nm("b")+" 願意："+S.b.agree.will;

  <h1>約定完成</h1>
  <p class="lead">你們把話說清楚了，也寫下了具體的做法。過幾天回來看看，約定有沒有做到、需不需要調整。</p>
  <div class="card"><span class="pill">約定日期 ${esc(f.date||S.created)}</span><div style="font-family:var(--font-display);font-size:20px;white-space:pre-wrap">${esc(f.text)}</div></div>
  <div class="split">${agreeView("a")}${agreeView("b")}</div>
  <div class="card">
    <label class="q" for="story">記下這次的經過（選填）</label>
    <p class="hint">很久以後再打開，也能想起這次發生了什麼。兩個人都可以寫或補充，之後在「回顧」也能修改。</p>
    <textarea id="story" style="min-height:140px" placeholder="例如：那天晚上約好一起吃飯，後來……">${esc(f.story||"")}</textarea>
    <div class="actions"><button class="btn ghost" type="button" id="svs">儲存經過</button><span class="hint" id="svm" aria-live="polite"></span></div>
  </div>
  <div class="actions"><button class="btn" type="button" id="cp">複製約定</button><button class="btn ghost" type="button" id="nw">開始新的一次對話</button></div>
  <div class="actions"><button class="btn ghost" type="button" id="hubb">回到我們的空間</button></div>
  <footer>之後的版本會加入：承擔與道歉、3～7 天後的追蹤提醒。</footer>`;
  document.getElementById("hubb").onclick=()=>goAct("hub");
  const st=document.getElementById("story"), svm=document.getElementById("svm");
  st.oninput=()=>{svm.textContent=""};

  const cp=document.getElementById("cp");
  cp.onclick=()=>{try{navigator.clipboard.writeText(text).then(()=>{cp.textContent="已複製"},()=>{cp.textContent="無法複製"})}catch(e){cp.textContent="無法複製"}};
  document.getElementById("nw").onclick=()=>{S.final.story=st.value.trim();S.rh=S.rh||[];S.rh.push(repairRec());S.call=null;S.cancelReq=null;S.cancelNote=null;S.a=blankPerson();S.b=blankPerson();S.final={text:"",ok:{a:false,b:false}};save();draft={a:{},b:{}};view={};render();window.scrollTo(0,0)};
}

function wait(st){

  <div class="card wait"><div class="breathe" aria-hidden="true"></div>
  <h2 style="margin-top:4px">給 ${esc(nm(other(role)))} 一點時間</h2><p style="margin:0">${esc(st.msg)}</p></div>
  ${st.step<=2&&role==="a"&&!S.names.b?inviteCard():""}

function val(id){return document.getElementById(id).value.trim()}

/* ---------- quick-pick phrases ---------- */
const Q={
  fact:["約好的事情臨時改變了：","我說話的時候，你沒有回應","你說話的音量變大了","你提到了以前的事","你沒有先跟我商量就決定了：","訊息很久沒有回","因為家事分工：","因為花錢的事："],
  interp:["我以為你不在乎我","我覺得自己不被重視","我覺得你在怪我","我覺得自己怎麼做都不對","我覺得被控制","我擔心你會離開","我覺得你不信任我","我覺得只有我在努力"],
  trig:["小時候家人起衝突的感覺","以前的感情經驗","被批評、被罵的經驗","被忽略、沒人理的經驗","被丟下的經驗","工作或學校的壓力"],
  care:["我們一起的時間","我的感受有被在乎","被當成一起做決定的人","家事或責任分配公平","你相信我是好意","約定有被遵守","有一點自己的空間"],
  valid:["換成是我，可能也會有一樣的感覺","你那時候不知道我在想什麼","這件事碰到了你很在意的地方","你之前有過類似的經驗","我那時候的反應確實讓人難受"],
  emp:["很孤單","不被重視","很委屈","很無力","很害怕","被誤解","很失望","很累"],
  more:["你說中了一部分，但我更在意的是","我不是在怪你，我只是","我當時其實比較像是覺得","對我來說最重要的是"],
  will:["感覺不對時，直接說出我的需要","生氣時先說「我需要暫停」，冷靜後再回來談","先聽你說完再回應","計畫要改變時，提早告訴你","只談這一次的事，不提起過去","每天留 10 分鐘好好聊天"],
  hope:["改變計畫時，提早告訴我","我說話時，先放下手機聽我說","有不舒服時，願意直接告訴我","相信我不是故意的","我需要暫停時，給我一點時間","偶爾主動問問我今天過得怎樣"],
  ft:["當{什麼情況}的時候，{誰}會{做什麼}。","每週{哪一天}，我們一起{做什麼}。","如果一方需要暫停，就說暗號「{暗號}」，{幾}分鐘後回來談。","計畫要改變時，至少提早{多久}告訴對方。"],
  fo:["很難形容","不太想多說","跟最近的壓力有關","有時候會，有時候不會"]
};

/* 依原因設計的快速選項：fact 只寫看得到、聽得到的事；interp 是當下的解讀；care 是在意的事；hope 是希望對方做的事 */
const REASON_Q=[
  {fact:["我等你主動問，你沒有問","重要的日子沒有特別安排","我暗示了，但沒有直接說"],interp:["我以為你應該懂","我覺得你不夠在意"],care:["不用每次說出口也能被懂"],hope:["不確定我想要什麼時，直接問我"]},
  {fact:["我在說心情時，你開始給建議","你說「這有什麼好難過的」","我想幫忙，所以很快給了建議"],interp:["我覺得你沒有在聽","我覺得我的幫忙不被需要"],care:["先被聽見，再談辦法"],hope:["先問我：想被聽，還是想要建議？"]},
  {fact:["碗沒有洗","訊息比較晚回","你忘了我說過的事："],interp:["我覺得自己被放在後面"],care:["我在你心裡的位置"],hope:["小事讓我不舒服時，問問我真正在意什麼"]},
  {fact:["你說了「你每次都……」","你嘆氣或翻了白眼","你用了帶刺的話："],interp:["我覺得被批評","我覺得你看不起我"],care:["就算生氣，也能好好說話"],hope:["不舒服時，用「我覺得」開頭說"]},
  {fact:["你沉默了很久","你希望馬上把話講清楚","和家人有關的事："],interp:["我覺得你在冷戰","我覺得你在逼我"],care:["找到我們自己的相處方式"],hope:["說說你家以前怎麼處理不愉快"]},
  {fact:["我想談，你離開了房間","你一直追問，我說需要冷靜","你說「我不想談了」"],interp:["我覺得被丟下","我覺得喘不過氣"],care:["確定你還會回來談","有喘口氣的空間"],hope:["需要暫停時，告訴我什麼時候回來談"]},
  {fact:["那天我們都很累","一下班回家就談起這件事","我那陣子睡得不好"],interp:["我覺得沒有力氣再多做什麼","我覺得你不體諒我的累"],care:["我的累有被體諒"],hope:["我很累的時候，晚一點再談"]},
  {fact:["因為花錢的事：","因為家事分工：","和家人相處的事：","時間怎麼安排："],interp:["我覺得你不尊重我的想法"],care:["我的想法也被考慮"],hope:["先了解我為什麼這樣想"]},
  {fact:["這件事之前也發生過：","我忍了一段時間才說","一件小事之後，我突然很生氣"],interp:["我覺得一直是我在讓步"],care:["說出來也不會被嫌麻煩"],hope:["我說出不舒服時，先別急著解釋"]},
  {fact:["我們在爭誰說得對","你說「明明就是你……」","我們在爭誰該先道歉"],interp:["我覺得一定要說清楚才行"],care:["問題被解決，不是誰贏"],hope:["一起找辦法，而不是找錯"]},
  {fact:["你說了一句話：","你傳的訊息：","我看到你在："],interp:["我以為你的意思是：","我覺得你在暗示我"],care:["我的本意有被理解"],hope:["不確定我的意思時，先問我"]},
  {fact:["你說「如果你愛我，就……」","你說要是我不做，你就：","我答應了，但心裡不願意"],interp:["我覺得不答應就是我的錯"],care:["說「不」的時候也是安全的"],hope:["需要什麼，直接告訴我"]}
];
function reasonOpts(field,list){
  const sp=list.flatMap(i=>(REASON_Q[i]||{})[field]||[]);
  return [...new Set([...sp,...Q[field]])].slice(0,Math.max(8,sp.length));
}
function quick(id,list){
  return `<div class="quick" role="group" aria-label="快速選項">${(list||Q[id]).map(t=>`<button type="button" data-qt="${id}" data-tx="${esc(t)}"${t.includes("{")?' data-tpl="1"':""}>${esc(t.replace(/\{[^}]*\}/g,"＿＿"))}</button>`).join("")}</div>`;
}
function removePhrase(v,t){
  const i=v.indexOf(t); if(i<0)return v;
  let a=i,z=i+t.length;
  if(a>0&&/[，、]/.test(v[a-1]))a--;
  else if(/[，、]/.test(v[z]||""))z++;
  return v.slice(0,a)+v.slice(z);
}
function syncQuick(id){
  const el=document.getElementById(id); if(!el)return;
  app.querySelectorAll('[data-qt="'+id+'"]').forEach(b=>{
    const c=composed[b.dataset.tx];
    const on=b.dataset.tpl?!!(c&&el.value.includes(c)):el.value.includes(b.dataset.tx);
    b.classList.toggle("used",on); b.setAttribute("aria-pressed",on);
  });
}
const composed={};
function appendText(el,t){
  const v=el.value;
  const sep=!v?"":(/[。，、：！？\s]$/.test(v)?"":(el.tagName==="INPUT"?"、":"，"));
  el.value=v+sep+t;
  el.dispatchEvent(new Event("input",{bubbles:true}));
}
function openFiller(b,el){
  const group=b.parentElement;
  const old=group.nextElementSibling;
  if(old&&old.classList.contains("filler")){ const same=old.dataset.for===b.dataset.tx; old.remove(); if(same)return; }
  const tpl=b.dataset.tx;
  const parts=tpl.split(/(\{[^}]*\})/).filter(Boolean);
  const box=document.createElement("div");
  box.className="filler"; box.dataset.for=tpl;
  let n=0;
  box.innerHTML=`<div class="filler-line">${parts.map(pt=>{
    if(pt[0]==="{"){const ph=pt.slice(1,-1);const i=n++;
      return `<input type="text" class="blank" id="blank-${i}" aria-label="${esc(ph)}" placeholder="${esc(ph)}" style="--w:${Math.max([...ph].length,2)}">`}
    return `<span>${esc(pt)}</span>`}).join("")}</div>
    <div class="err" id="ferr"></div>
    <div class="actions"><button type="button" class="btn" id="fadd">加入</button><button type="button" class="btn ghost" id="fcancel">取消</button></div>`;
  group.after(box);
  const inputs=[...box.querySelectorAll(".blank")];
  inputs.forEach((inp,i)=>{
    inp.addEventListener("input",()=>{box.querySelector("#ferr").textContent="";inp.style.setProperty("--w",Math.max([...inp.placeholder].length,2,[...inp.value].length+1))});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(i<inputs.length-1)inputs[i+1].focus();else box.querySelector("#fadd").click()}});
  });
  box.querySelector("#fcancel").onclick=()=>box.remove();
  box.querySelector("#fadd").onclick=()=>{
    if(inputs.some(x=>!x.value.trim())){box.querySelector("#ferr").textContent="每個空格都填好後再加入。";return}
    let k=0;
    const sentence=parts.map(pt=>pt[0]==="{"?inputs[k++].value.trim():pt).join("");
    composed[tpl]=sentence;
    appendText(el,sentence);
    box.remove(); el.focus();
  };
  inputs[0].focus();
}
function wireQuick(){
  const ids=new Set();
  app.querySelectorAll("[data-qt]").forEach(b=>{ids.add(b.dataset.qt);b.onclick=()=>{
    const el=document.getElementById(b.dataset.qt); if(!el)return;
    let t=b.dataset.tx; const v=el.value;
    if(b.dataset.tpl){
      const c=composed[t];
      if(c&&v.includes(c)){ el.value=removePhrase(v,c); el.dispatchEvent(new Event("input",{bubbles:true})); return; }
      return openFiller(b,el);
    }
    if(v.includes(t)){ el.value=removePhrase(v,t); }
    else{
      const sep=!v?"":(/[。，、：！？\s]$/.test(v)?"":(el.tagName==="INPUT"?"、":"，"));
      el.value=v+sep+t;
    }
    el.dispatchEvent(new Event("input",{bubbles:true}));
    el.focus();
    try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}
  }});
  ids.forEach(id=>{const el=document.getElementById(id);if(!el)return;
    el.addEventListener("input",()=>syncQuick(id));syncQuick(id)});
}
function topFeel(r){return Object.entries(S[r].entry.feel).sort((x,y)=>y[1]-x[1]).map(([f])=>f)}
